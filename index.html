<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TODOリスト</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>TODOリスト</h1>

    <form id="new-todo-form" class="new-todo" autocomplete="off">
      <input id="new-todo-input" type="text" placeholder="やることを入力して Enter" maxlength="200" required aria-label="新しいTODO">
      <button type="submit">追加</button>
    </form>

    <nav class="filters" aria-label="表示の切り替え">
      <button type="button" data-filter="all" class="active">すべて</button>
      <button type="button" data-filter="active">未完了</button>
      <button type="button" data-filter="completed">完了済み</button>
    </nav>

    <ul id="todo-list" class="todo-list"></ul>
    <p id="empty-message" class="empty" hidden>TODOはありません</p>

    <footer class="footer">
      <span id="remaining-count"></span>
      <button type="button" id="clear-completed" class="link-button">完了済みを削除</button>
    </footer>

    <p class="hint">ダブルクリックで編集（Enter で確定 / Esc で取消）</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
